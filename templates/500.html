<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>حدث خطأ مؤقت (500) | Brand Veloura</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #fff0f7 0%, #fff7fa 50%, #fdf2f8 100%);
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            max-width: 28rem;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid #fbcfe8;
            border-radius: 1.5rem;
            padding: 2.25rem 2rem;
            text-align: center;
            box-shadow: 0 20px 45px rgba(190, 24, 93, 0.08);
        }
        .badge {
            width: 4.5rem;
            height: 4.5rem;
            margin: 0 auto 1.25rem;
            border-radius: 1rem;
            background: #fffbeb;
            border: 1px solid #fde68a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
        }
        .code {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #d97706;
            margin-bottom: 0.5rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 0.75rem;
            color: #0f172a;
        }
        p {
            font-size: 0.875rem;
            line-height: 1.7;
            color: #475569;
            margin-bottom: 1.5rem;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.825rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s ease, background-color 0.2s ease;
            border: 1px solid transparent;
        }
        .btn-primary {
            background: #0f172a;
            color: #ffffff;
        }
        .btn-primary:hover { background: #000000; }
        .btn-secondary {
            background: #ffffff;
            color: #1e293b;
            border-color: #fbcfe8;
        }
        .btn-secondary:hover { background: #fdf2f8; }
        .brand {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 0.04em;
        }
    </style>
</head>
<body>
    <main class="card" role="main">
        <div class="badge" aria-hidden="true">🛡️</div>
        <span class="code">Error 500</span>
        <h1>عذراً، حدث خطأ مؤقت بالخادم</h1>
        <p>
            يقوم فريقنا التقني بمراجعة الخلل ومعالجته على الفور. يرجى إعادة المحاولة بعد لحظات أو العودة للصفحة الرئيسية.
        </p>
        <div class="actions">
            <button type="button" onclick="window.location.reload();" class="btn btn-primary">
                إعادة تحميل الصفحة
            </button>
            <a href="/" class="btn btn-secondary">
                العودة إلى الرئيسية
            </a>
        </div>
        <div class="brand">Brand Veloura</div>
    </main>
</body>
</html>
