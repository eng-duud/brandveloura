    {{ cart_count }}
</span>{% if oob_sync %}<div id="bottom-bar-cart-badge" hx-swap-oob="innerHTML" class="absolute -top-1 -right-1 z-20">{% include 'store/partials/cart_badge.html' with cart_count=cart_count oob_sync=False %}</div>{% endif %}
