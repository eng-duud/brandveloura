<!-- Luxury Shimmer Skeleton for Instant Progressive Hydration -->
<section class="py-10 bg-white/40 border-b border-pink-200 animate-pulse select-none" aria-hidden="true">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <!-- Header Skeleton -->
        <div class="flex items-center justify-between mb-5">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-xl bg-pink-200/60 border border-pink-200 shrink-0"></div>
                <div class="space-y-1.5">
                    <div class="h-4.5 sm:h-5 w-32 sm:w-44 bg-slate-200/80 rounded-lg"></div>
                    <div class="h-3 w-48 sm:w-64 bg-pink-100/80 rounded-md"></div>
                </div>
            </div>
            
            <div class="flex items-center gap-1">
                <div class="w-8 h-8 rounded-xl bg-white border border-pink-200 shadow-2xs"></div>
                <div class="w-8 h-8 rounded-xl bg-white border border-pink-200 shadow-2xs"></div>
            </div>
        </div>

        <!-- Horizontal Cards Strip Skeleton -->
        <div class="flex flex-nowrap items-stretch gap-3 sm:gap-4 overflow-x-hidden pb-4 pt-1">
            {% for i in "123456" %}
            <div class="shrink-0 flex flex-col" style="flex: 0 0 190px !important; width: 190px !important;">
                <div class="h-full rounded-2xl bg-white border border-pink-200 p-3 flex flex-col justify-between shadow-2xs">
                    <div>
                        <!-- Image placeholder with luxury shimmer gradient -->
                        <div class="aspect-square w-full rounded-xl bg-gradient-to-tr from-pink-100/70 via-rose-50 to-pink-100/50 mb-3 relative overflow-hidden">
                            <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/50 to-transparent -translate-x-full animate-[shimmer_1.5s_infinite]"></div>
                        </div>
                        
                        <!-- Badge & Category -->
                        <div class="h-3 w-16 bg-pink-100 rounded-full mb-2"></div>
                        <!-- Product Title -->
                        <div class="h-3.5 w-28 bg-slate-200/70 rounded-md mb-2"></div>
                        <div class="h-3 w-20 bg-slate-100 rounded-md mb-3"></div>
                    </div>

                    <!-- Price & CTA -->
                    <div class="pt-2 border-t border-pink-100 flex items-center justify-between">
                        <div class="h-4 w-16 bg-brand-100/70 rounded-md"></div>
                        <div class="w-7 h-7 rounded-xl bg-pink-100"></div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

    </div>
</section>
