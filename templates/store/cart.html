{% extends 'base.html' %}

{% block title %}سلة المشتريات | {{ store_settings.store_name }}{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10">
    <!-- Clean Header -->
    <div class="flex items-center justify-between mb-6 pb-3 border-b border-rose-100/80">
        <div>
            <h1 class="text-xl sm:text-3xl font-serif font-bold text-slate-900">سلة المشتريات</h1>
            <p class="text-[11px] sm:text-xs text-slate-500 mt-0.5">مراجعة المنتجات والكميات المحددة قبل التوجه لصفحة إتمام الطلب</p>
        </div>
        <div class="flex items-center gap-1.5 text-[11px] font-semibold text-brand-700 bg-rose-50 px-3 py-1.5 rounded-xl border border-rose-200">
            <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-600"></i>
            <span>سداد رسمي موثق</span>
        </div>
    </div>

    <!-- Interactive Cart Container (Managed by HTMX) -->
    {% include 'store/partials/cart_table.html' %}
</div>
{% endblock %}
