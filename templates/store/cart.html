{% extends 'base.html' %}

{% block title %}سلة المشتريات | {{ store_settings.store_name }}{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10">
    <!-- Breadcrumb (Prominent Luxury Capsule) -->
    <div class="mb-4">
        <nav class="inline-flex items-center gap-2 text-xs sm:text-sm font-bold bg-white/90 backdrop-blur-md border border-pink-200/90 rounded-2xl px-4 py-2 shadow-2xs text-slate-600">
            <a href="{% url 'store:home' %}" class="flex items-center gap-1.5 text-slate-600 hover:text-brand-600 transition cursor-pointer">
                <i data-lucide="home" class="w-4 h-4 text-brand-500"></i>
                <span>الرئيسية</span>
            </a>
            <i data-lucide="chevron-left" class="w-4 h-4 text-brand-400"></i>
            <span class="text-brand-600 font-extrabold">سلة المشتريات</span>
        </nav>
    </div>

    <!-- Clean Header -->
    <div class="flex items-center justify-between mb-6 pb-3 border-b border-pink-200">
        <div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900">سلة المشتريات</h1>
        </div>
        <a href="{% url 'store:product_list' %}" class="text-xs text-slate-600 hover:text-brand-600 transition font-medium">
            متابعة التسوق ←
        </a>
    </div>

    <!-- Interactive Cart Container (Managed by HTMX) -->
    {% include 'store/partials/cart_table.html' %}
</div>
{% endblock %}
