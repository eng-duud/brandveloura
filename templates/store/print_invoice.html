{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة مبيعات رسمية | طلب #{{ order.order_number }} — Brand Veloura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Amiri:ital,wght@0,400;0,700;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/fonts.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    {% include 'store/includes/invoice_styles.html' %}
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f1f5f9;
            font-family: 'Cairo', system-ui, sans-serif;
            color: #0f172a;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }
        .controls-bar {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: #ffffff;
            padding: 12px 20px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .controls-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            border: none;
        }
        .btn-print {
            background: #0f172a;
            color: #ffffff;
        }
        .btn-print:hover { background: #1e293b; }
        .btn-png {
            background: linear-gradient(135deg, #e83ab8 0%, #be185d 100%);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(232, 58, 184, 0.3);
        }
        .btn-png:hover { opacity: 0.93; transform: translateY(-1px); }
        .btn-back {
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }
        .btn-back:hover { color: #0f172a; }

        @media print {
            body {
                background: #ffffff !important;
                padding: 0 !important;
            }
            .controls-bar {
                display: none !important;
            }
            .invoice-sheet {
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                max-width: 100% !important;
                page-break-inside: avoid;
            }
            @page {
                size: A4 portrait;
                margin: 12mm 15mm;
            }
        }
    </style>
</head>
<body>

    <!-- Controls Bar for Admin Print -->
    <div class="controls-bar" id="invoice-controls">
        <a href="javascript:window.history.back()" class="btn-back">✕ رجوع</a>
        <div style="font-size: 12px; font-weight: 700; color: #475569;">
            فاتورة مبيعات طلب #{{ order.order_number }}
        </div>
        <div class="controls-actions">
            <button type="button" onclick="downloadInvoicePNG()" id="btn-save-png" class="btn-action btn-png">
                <span>📥 حفظ كصورة PNG</span>
            </button>
            <button type="button" onclick="window.print()" class="btn-action btn-print">
                <span>🖨️ طباعة الفاتورة A4</span>
            </button>
        </div>
    </div>

    <!-- The Reusable Invoice Sheet -->
    <div id="invoice-sheet-container">
        {% include 'store/includes/order_invoice_sheet.html' with order=order store_settings=store_settings %}
    </div>

    <script>
        async function downloadInvoicePNG() {
            const btn = document.getElementById('btn-save-png');
            const originalText = btn.innerHTML;
            const sheet = document.querySelector('.invoice-sheet');

            try {
                btn.disabled = true;
                btn.innerHTML = '<span>⏳ جارٍ التوليد...</span>';

                const canvas = await html2canvas(sheet, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#ffffff',
                    logging: false,
                    windowWidth: 1000
                });

                const link = document.createElement('a');
                link.download = `فاتورة-فيلورا-${'{{ order.order_number }}'}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                uploadInvoiceToCloudinary(canvas.toDataURL('image/png'));

                btn.innerHTML = '<span>✓ تم الحفظ بنجاح</span>';
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }, 3000);

            } catch (err) {
                console.error('Error generating invoice PNG:', err);
                alert('حدث خطأ أثناء حفظ الفاتورة، يرجى المحاولة مرة أخرى.');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        async function uploadInvoiceToCloudinary(base64Data) {
            try {
                const csrfToken = getCookie('csrftoken');
                await fetch('/api/order/{{ order.order_number }}/save-invoice-image/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({ image_data: base64Data })
                });
            } catch (e) {
                console.warn('Cloudinary background upload info:', e);
            }
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
